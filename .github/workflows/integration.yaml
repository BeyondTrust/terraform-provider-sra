name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: none

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Configure Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: "Build"
        run: go build -v ./...

      - name: "Unit Tests"
        run: go test $(go list ./... | grep -v /test)

      - name: "Offline E2E harness tests"
        # The E2E package's own safety logic (markers, the import orphan guard,
        # the orphan sweeper) tested against in-process mocks. No appliance and
        # no credentials; the live tests are not matched by this pattern.
        run: go test -count=1 -run '^(TestMarker|TestSafeToReclaim|TestSweep[A-Z])' ./test

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Configure Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout 5m0s
